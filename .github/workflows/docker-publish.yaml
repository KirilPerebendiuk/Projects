
name: Docker Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare image tag
        id: vars
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short_sha=${SOURCE_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ steps.vars.outputs.short_sha }}

      - name: Checkout GitOps configuration
        uses: actions/checkout@v4
        with:
          ref: main
          path: gitops
          persist-credentials: true

      - name: Update Helm image tag
        working-directory: gitops
        env:
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
        run: |
          set -euo pipefail

          sed -i -E \
            "0,/tag: sha-[[:xdigit:]]+/s//tag: sha-${SHORT_SHA}/" \
            helm/task-platform/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/task-platform/values.yaml

          if git diff --cached --quiet; then
            echo "Helm image tag is already up to date."
          else
            git commit -m "chore(gitops): deploy sha-${SHORT_SHA}"
            git push origin HEAD:main
          fi

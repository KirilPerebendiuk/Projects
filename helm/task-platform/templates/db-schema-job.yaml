apiVersion: batch/v1
kind: Job
metadata:
  name: task-db-schema-{{ .Release.Revision }}
  labels:
    app: task-platform
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: task-platform
    spec:
      restartPolicy: Never
      containers:
        - name: apply-schema
          image: postgres:17
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready -h postgres -p 777 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done

              psql -v ON_ERROR_STOP=1 \
                -h postgres \
                -p 777 \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" \
                -f /schema/schema.sql
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: task-db-schema
